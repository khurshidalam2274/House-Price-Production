{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("{% static 'homeimg.jpg' %}");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
        }

        .prediction-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .prediction-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .prediction-card:hover::before {
            left: 100%;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            height: 50px;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-predict {
            background: rgba(52, 152, 219, 0.4);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-predict:hover {
            background: rgba(52, 152, 219, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(46, 204, 113, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-label {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            display: block;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="prediction-card">
            <h1>House Price Prediction</h1>
            <form action="{% url 'result' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="input-label">Average Area Income</label>
                    <input type="number" class="form-control" name="n1" required>
                </div>
                <div class="form-group">
                    <label class="input-label">Average House Age</label>
                    <input type="number" class="form-control" name="n2" required>
                </div>
                <div class="form-group">
                    <label class="input-label">Average Number of Rooms</label>
                    <input type="number" class="form-control" name="n3" required>
                </div>
                <div class="form-group">
                    <label class="input-label">Average Number of Bedrooms</label>
                    <input type="number" class="form-control" name="n4" required>
                </div>
                <div class="form-group">
                    <label class="input-label">Area Population</label>
                    <input type="number" class="form-control" name="n5" required>
                </div>
                <button type="submit" class="btn-predict">Predict Price</button>
            </form>
            
            {% if result %}
            <div class="result">
                <h3>{{ result }}</h3>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
